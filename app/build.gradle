plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wm.streamhub'
    compileSdk 34

    defaultConfig {
        applicationId "com.wm.streamhub"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    // The keystore is deliberately NOT committed. Locally, drop your own
    // app/keystore/streamhub.jks in place; in CI it is decoded from the
    // KEYSTORE_BASE64 secret. If neither exists we fall back to the debug key so
    // the build still produces an installable APK.
    signingConfigs {
        release {
            def ksFile = file(System.getenv("KEYSTORE_PATH") ?: "keystore/streamhub.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "streamhub"
                keyAlias System.getenv("KEY_ALIAS") ?: "streamhub"
                keyPassword System.getenv("KEY_PASSWORD") ?: "streamhub"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig file("keystore/streamhub.jks").exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    def media3 = '1.3.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.media3:media3-common:$media3"
    implementation "androidx.media3:media3-datasource:$media3"
}
