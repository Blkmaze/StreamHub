name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # Pins the cmdline-tools build that v3 used by default (short
          # version 16.0). v4 changed its own default to 20.0 — leave that
          # for a deliberate bump later instead of picking it up here.
          cmdline-tools-version: 12266719

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          # Strip whitespace/CR/LF that copy-pasting the secret into the GitHub
          # UI can introduce (Windows clipboard, wrapped lines, a trailing
          # newline from the text editor). A bare `base64 -d` treats any of
          # that as invalid input and fails the whole job.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/keystore/streamhub.jks
          bytes="$(stat -c%s app/keystore/streamhub.jks)"
          if [ "$bytes" -lt 100 ]; then
            echo "::error::Decoded keystore is only $bytes bytes — KEYSTORE_BASE64 secret looks truncated or wrong. Re-copy it with Ctrl+A/Ctrl+C from KEYSTORE_BASE64.txt and update the secret."
            exit 1
          fi
          echo "Keystore restored ($bytes bytes)"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/StreamHubTV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/StreamHubTV-release.apk
          ls -lh out

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: StreamHubTV-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish rolling release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of ${{ github.sha }}.
            Sideload `StreamHubTV-release.apk` with the Downloader app.
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
