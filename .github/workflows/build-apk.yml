name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/streamhub.jks
          echo "Keystore restored ($(stat -c%s app/keystore/streamhub.jks) bytes)"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/StreamHubTV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/StreamHubTV-release.apk
          ls -lh out

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StreamHubTV-apk
          path: out/*.apk
          retention-days: 90

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of ${{ github.sha }}.
            Sideload `StreamHubTV-release.apk` with the Downloader app.
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
